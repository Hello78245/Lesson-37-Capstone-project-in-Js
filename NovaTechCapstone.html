<html>
  <head>
    <title>
      Nova Tech Capstone
    </title>
    <style>
      .nova-beta{
        border: 2px solid #00eaff;
        background: rgba(0,20,40,0.55);
        backdrop-filter:blur(6px);
        padding: 16px 20px;
        border-radius: 6px;
        color: #00eaff;
        font-family:Georgia, 'Times New Roman', Times, serif;
        font-size: 0.95rem;
        line-height: 1.5;
        box-shadow: 0 0 12px rgba(0,20,40,0.55);
      }
      .hidden{
        display: none;
      }

    </style>
  </head>
  <body>
    <div id="nova-beta" class="assistant-message nova-beta hidden"></div>
    <div id="assistant-messages"></div>
    <script>
      const technicalKeywords=[ "explain", "analyze","optomize","optomization","diagnose","diagnostic", "break it down", "system", "html", "logic"];
      function routeMessageToAI(userMessage){
        const lower=userMessage.toLowerCase();
        const isTechnical=technicalKeywords;
        (word=> lower.includes(word));
        if(isTechnical){
          return nova-beta(userMessage);
        } 
      }
    </script>
  </body>
</html>
